name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Run JavaScript actions on Node 24 (opt in ahead of GitHub's June 2026 default).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Test player
        run: npm ci && npm test

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Prepare site artifact
        # Only what the site loads: from lyrics/ that is the timed .lrc files
        # (the .txt sheets and lyrics/README.md are for the sync tool).
        run: |
          mkdir -p _site/lyrics
          cp index.html CNAME LICENSE _site/
          cp -R assets audio data _site/
          cp lyrics/*.lrc _site/lyrics/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
